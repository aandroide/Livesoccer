name: LiveSoccerTV eventi

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: livesoccertv
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: livesoccertv/requirements.txt

      - name: Dipendenze
        run: |
          pip install -r livesoccertv/requirements.txt
          playwright install --with-deps chrome chromium

      - name: Scraping (browser sotto xvfb)
        env:
          HEADLESS: "0"
          BROWSER_CHANNEL: chrome
          OUT_DIR: livesoccertv/output
          DEBUG_DIR: livesoccertv/debug
        run: xvfb-run -a python livesoccertv/livesoccertv_scraper.py --debug

      - name: Salva debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: livesoccertv-debug
          path: livesoccertv/debug
          if-no-files-found: ignore
          retention-days: 3

      - name: Commit JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add livesoccertv/output
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "LiveSoccerTV aggiornamento $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
